<!-- =========================
     載入 CSS 樣式檔
========================= -->
<link rel="stylesheet" href="style.css">


<!-- =========================
     背景層
========================= -->
<!--
  日夜模式背景會套用在這裡
  JS 會幫它切換 class
-->
<div id="bg"></div>


<!-- =========================
     遊戲主容器
========================= -->
<div class="game">

  <!-- =========================
       遊戲標題
  ========================= -->
  <h1 class="title">
    壞壞里魚
  </h1>


  <!-- =========================
       角色區域
  ========================= -->
  <div class="pet-area">

    <!-- =========================
         愛心特效容器
    ========================= -->
    <!--
      JS 會動態生成愛心
      並放進這裡
    -->
    <div id="hearts"></div>


    <!-- 電子雞角色圖片 -->
<!-- 預設圖片是 normal.png -->
<img
  id="pet"
  src="https://raw.githubusercontent.com/ykloqm6600/ykloqm6600/main/normal.png"
  alt="壞壞里魚"
>

  </div>


  <!-- =========================
       對話框
  ========================= -->
  <!--
    所有角色台詞
    都會顯示在這裡
  -->
  <div
    id="speech"
    class="speech"
  >
    你怎麼又來了？不用上班嗎？
  </div>


  <!-- =========================
       狀態欄
  ========================= -->
  <div class="status">

    <!-- =========================
         親密度
    ========================= -->
    <div class="status-box">

      <!-- 標題 -->
      <span class="label">
        親密度
      </span>

      <!-- 數值 -->
      <span id="love">
        0
      </span>

    </div>


    <!-- =========================
         心情值
    ========================= -->
    <div class="status-box">

      <!-- 標題 -->
      <span class="label">
        心情
      </span>

      <!-- 數值 -->
      <span id="mood">
        50
      </span>

    </div>

  </div>


  <!-- =========================
       按鈕區
  ========================= -->
  <div class="buttons">

    <!-- =========================
         摸摸按鈕
    ========================= -->
    <!--
      點擊後：
      + 親密度
      + 心情
      + 愛心特效
    -->
    <button
      type="button"
      onclick="petPet()"
    >
      摸摸
    </button>


    <!-- =========================
         餵食按鈕
    ========================= -->
    <!--
      點擊後：
      + 心情
    -->
    <button
      type="button"
      onclick="feedPet()"
    >
      餵食
    </button>


    <!-- =========================
         睡覺按鈕
    ========================= -->
    <!--
      點擊後：
      + 心情
      切換睡覺表情
    -->
    <button
      type="button"
      onclick="sleepPet()"
    >
      睡覺
    </button>

  </div>

</div>


<!-- =========================
     親密度稱號
========================= -->
<!--
  JS 會根據 love 數值
  自動切換稱號
-->
<p id="titleText">

  陌生人

</p>


<!-- =========================
     載入 JavaScript
========================= -->
<!--
  所有遊戲邏輯都在 script.js
-->
<script src="script.js"></script>
